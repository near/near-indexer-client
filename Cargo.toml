[package]
name = "near-indexer-client"
version = "0.1.0"
edition = "2024"
description = "Pull-based NEAR HTTP indexing with consumer-owned checkpoints"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/near/near-indexer-client"
documentation = "https://docs.rs/near-indexer-client"
keywords = ["near", "indexer", "rpc", "blockchain"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "examples/**", "tests/**", "Cargo.toml", "Cargo.lock", "README.md", "CHANGELOG.md", "CONTRIBUTING.md", "RELEASING.md", "LICENSE-*"]

[dependencies]
near-indexer-primitives = "0.37.4"
near-kit = { version = "0.18.0", default-features = false, features = ["rpc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[lints.rust]
missing_docs = "warn"
